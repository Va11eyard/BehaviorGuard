name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install package (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff (advisory; baseline currently fails — not a merge blocker)
        continue-on-error: true
        run: ruff check src tests evaluation.py evaluate.py reproduce.py scripts tools

      - name: Pytest
        run: pytest tests -v --no-cov

      - name: Sequential-study smoke (cached scores, no model download)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python scripts/sequential_ato_study.py --dataset personachat --out /tmp/sequential_smoke.json
          python scripts/ci_smoke_check.py /tmp/sequential_smoke.json
